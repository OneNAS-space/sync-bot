name: Sync OpenWrt and Patch for SBE1V1K

on:
  schedule:
    - cron: '9 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'my_files/**'
      - 'my_patches/**'
      - 'scripts/**'
      - '!**/.github/**'
      - '!README.md'
      - '!LICENSE'
      - '!SECURITY.md'

env:
  TARGET_REPO: OneNAS-space/Askey_Spectrum_SBE1V1K
  TARGET_BRANCH: main

jobs:
  sync-openwrt_main-and-auto_gen_patch:
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout Config Repo (sync-bot)
        uses: actions/checkout@v7
        with:
          path: config-repo

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install OpenWrt Build Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk git gettext \
            libncurses5-dev libssl-dev python3 rsync unzip wget xsltproc \
            file quilt

      - name: Fetch OpenWrt Upstream
        run: |
          git clone --single-branch -b main https://github.com/openwrt/openwrt.git openwrt-src

      - name: Apply OpenWrt Tree Patches & Stage Kernel Patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          export LC_ALL=C
          cd openwrt-src

          # Apply every my_patches/NNNN-*.patch in file-name order, so adding
          # or removing a patch file needs no change here. The first patch
          # that does not apply cleanly fails the job.
          patches=(../config-repo/my_patches/[0-9][0-9][0-9][0-9]-*.patch)
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "::error::no patches found in my_patches/"
            exit 1
          fi

          for p in "${patches[@]}"; do
            name=$(basename "$p")
            echo "=== Applying $name"
            rc=0
            out=$(patch -p1 < "$p" 2>&1) || rc=$?
            echo "$out"
            if [ "$rc" -ne 0 ]; then
              if grep -q "Reversed (or previously applied)" <<<"$out"; then
                echo "::error::$name looks already merged upstream: delete it from my_patches/"
              else
                echo "::error::$name does not apply to current upstream: rebase it (see .rej below)"
              fi
              find . -name '*.rej' -print -exec cat {} \;
              exit 1
            fi
            if grep -qi " fuzz " <<<"$out"; then
              echo "::warning::$name applied with fuzz, please review"
            fi
          done

      - name: Select Target (qualcommbe / ipq95xx)
        run: |
          cd openwrt-src
          echo "CONFIG_TARGET_qualcommbe=y" > .config
          echo "CONFIG_TARGET_qualcommbe_ipq95xx=y" >> .config
          echo "CONFIG_TARGET_qualcommbe_ipq95xx_DEVICE_askey_sbe1v1k=y" >> .config
          make defconfig

      - name: Prepare Upstream Baseline Sources
        run: |
          cd openwrt-src
          make target/linux/{download,prepare}
          make package/kernel/mac80211/{download,prepare}
          make package/network/services/hostapd/{download,prepare}

      - name: Auto-Apply Dynamic Kernel Patches
        env:
          STRICT: '1'
        run: |
          cd openwrt-src
          set -euo pipefail
          export ROOT_DIR=$PWD

          pick() {
            local d
            d=$(ls -d $2 2>/dev/null | grep -v 'orig' | head -n 1 || true)
            if [ -z "$d" ]; then
              echo "::error::$1 source dir not found (glob: $2)" >&2
              ls -d build_dir/target-*/* 2>/dev/null | head -50 >&2
              exit 1
            fi
            echo "$ROOT_DIR/$d"
          }

          KERNEL_DIR="$(pick kernel 'build_dir/target-*/linux-*/linux-6.*')"
          MAC80211_DIR="$(pick mac80211 'build_dir/target-*/linux-*/mac80211-regular/backports-*')"
          HOSTAPD_DIR="$(pick hostapd 'build_dir/target-*/hostapd-*/hostapd-*')"
          export KERNEL_DIR MAC80211_DIR HOSTAPD_DIR

          python3 ../config-repo/scripts/apply_dynamic_patches.py

      - name: Fetch and Set Official Vermagic
        run: |
          cd openwrt-src
          MANIFEST_URL="https://downloads.openwrt.org/snapshots/targets/qualcommbe/ipq95xx/openwrt-qualcommbe-ipq95xx.manifest"
          VERMAGIC=$(curl -sL "$MANIFEST_URL" | grep "^kernel - " | awk -F'~' '{print $2}' | cut -d'-' -f1)
          if [ -z "$VERMAGIC" ]; then
            echo "Error: Failed to extract vermagic!"
            exit 1
          fi
          echo "Extracted vermagic: $VERMAGIC"
          echo "$VERMAGIC" > vermagic

      - name: Commit and Push to Target Repo
        env:
          TARGET_TOKEN: ${{ secrets.PAT }}
        run: |
          cd openwrt-src
          rm -rf .github
          cp ../config-repo/my_files/*.md ./

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add target "https://x-access-token:${TARGET_TOKEN}@github.com/${TARGET_REPO}.git"

          git add -A
          git commit -m "Auto-gen patches and configs for Askey SBE1V1K"

          git push target HEAD:"${TARGET_BRANCH}" --force
