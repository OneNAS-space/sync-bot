          cd /tmp/luci-app-log-viewer
          git checkout master
          
      - name: Add upstream and fetch
        run: |
          cd /tmp/luci-app-log-viewer
          git remote add upstream https://github.com/gSpotx2f/luci-app-log.git || true
          git fetch upstream master

      - name: Update from upstream (excluding workflows and docs you want to keep)
        run: |
          cd /tmp/luci-app-log-viewer
