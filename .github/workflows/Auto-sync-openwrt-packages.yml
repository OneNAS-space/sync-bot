name: Mirror multiple upstream repos to public forks
permissions:
  contents: write

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '!**/my_files/**'
      - '!**/my_patches/**'
      - '!**/scripts/**'
      - '!**/.github/**'
      - '!README.md'
      - '!LICENSE'
      - '!SECURITY.md'
  
env:
  TZ: Asia/Shanghai
  
jobs:
  sync-luci-app-advanced-reboot:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone target repo
        run: |
          git clone https://x-access-token:${{ secrets.PAT }}@github.com/OneNAS-space/luci-app-advanced-reboot.git /tmp/luci-app-advanced-reboot
          cd /tmp/luci-app-advanced-reboot
          git checkout main

      - name: Add upstream and fetch
        run: |
          cd /tmp/luci-app-advanced-reboot
          git remote add upstream https://github.com/mossdef-org/luci-app-advanced-reboot.git || true
          git fetch upstream main

      - name: Update from upstream (excluding workflows)
        run: |
          cd /tmp/luci-app-advanced-reboot
          git checkout upstream/main -- . \
            ':!.github/' \
            ':!SECURITY.md' \
            ':!LICENSE' \
            ':!CONTRIBUTING.md'

      - name: Commit and push
        run: |
          cd /tmp/luci-app-advanced-reboot
          git add -A
          git commit -m "Sync from mossdef-org" || echo "No changes"
          git push origin main --force

  sync-luci-app-log-viewer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v7
